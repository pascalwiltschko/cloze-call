packages:
  - apps/*
  - packages/*

catalogMode: prefer

catalog:
  "@testing-library/jest-dom": ^6.9.1
  "@types/node": ^24
  radix-ui: ^1.8.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  esbuild: true
